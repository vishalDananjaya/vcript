<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vcript Chat Interface</title>
  <link rel="stylesheet" href="style.css" />
  <!-- PeerJS Library for real-time WebRTC multi-user connections across devices -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-brand">
      <span class="v-red">V</span>cript chat interface
    </div>
  </header>

  <!-- Main Container -->
  <main class="chat-container">
    
    <!-- Left Sidebar Panel -->
    <section class="left-panel">
      <div class="field-group">
        <label for="cg-code">enter cg code</label>
        <input type="text" id="cg-code" placeholder="e.g. BANANA62" autocomplete="off" />
      </div>

      <div class="field-group">
        <label for="un-input">enter un</label>
        <input type="text" id="un-input" placeholder="e.g. user1" autocomplete="off" />
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="btn-call" class="btn btn-action">Call</button>
        <button id="btn-answer" class="btn btn-action">Answer</button>
      </div>

      <div id="status-indicator" class="status-box">Status: Disconnected</div>
    </section>

    <!-- Right Chat Area -->
    <section class="right-panel">
      <!-- Chat Display Box -->
      <div class="chat-box" id="chat-messages">
        <!-- Messages rendered dynamically here -->
      </div>

      <!-- Message Input & Buttons -->
      <div class="input-controls">
        <input type="text" id="message-input" placeholder="Type a message..." disabled autocomplete="off" />
        <button id="btn-push" class="btn btn-push" disabled>Push</button>
        <button id="btn-jump" class="btn btn-jump" disabled>Jump</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
