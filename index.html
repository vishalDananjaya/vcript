<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vcript — chat interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="v">V</span>cript</div>
    <div class="tagline">chat interface</div>
  </div>
  <div class="room-status" id="roomStatus">not connected</div>
</header>

<main class="app">

  <!-- LEFT: create / join panel -->
  <aside class="panel-auth" id="authPanel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="create" role="tab" aria-selected="true">Create group</button>
      <button class="tab" data-tab="join" role="tab" aria-selected="false">Join group</button>
    </div>

    <form id="createForm" class="auth-form active" autocomplete="off">
      <label for="createCode">vcript code</label>
      <input id="createCode" maxlength="40" placeholder="e.g. BANANA62" autocomplete="off" />

      <label for="createName">username</label>
      <input id="createName" maxlength="20" placeholder="e.g. vish" autocomplete="off" />

      <button type="submit" class="btn btn-primary">Call</button>
      <p class="hint">Pick any code — letters, numbers, dashes. Share it with whoever you want in the group.</p>
    </form>

    <form id="joinForm" class="auth-form" autocomplete="off">
      <label for="joinCode">vcript code</label>
      <input id="joinCode" maxlength="40" placeholder="e.g. BANANA62" autocomplete="off" />

      <label for="joinName">username</label>
      <input id="joinName" maxlength="20" placeholder="e.g. vish" autocomplete="off" />

      <button type="submit" class="btn btn-primary">Answer</button>
      <p class="hint">Enter the exact code someone shared with you.</p>
    </form>

    <p id="authError" class="error" hidden></p>
  </aside>

  <!-- RIGHT: message area -->
  <section class="panel-chat" id="chatPanel" hidden>
    <div class="chat-meta">
      <span id="roomCode" class="room-code"></span>
      <span id="userCount" class="user-count">0 online</span>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <form id="messageForm" class="message-form" autocomplete="off">
      <input id="messageInput" maxlength="500" placeholder="type a message..." autocomplete="off" />
      <div class="chat-actions">
        <button type="submit" class="btn btn-push">Push</button>
        <button type="button" id="jumpBtn" class="btn btn-jump">Jump</button>
      </div>
    </form>
  </section>

</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="app.js"></script>
</body>
</html>
